<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0}</style></head><body>
<iframe id="f" src="or/index.html" style="width:820px;height:2400px;border:0"></iframe>
<script>
document.getElementById('f').addEventListener('load',function(){setTimeout(function(){
  var d=document.getElementById('f').contentDocument;
  // jump straight to the EOQ answer by forcing state
  d.defaultView.state.set=2; d.defaultView.state.q=8; d.defaultView.render();
  setTimeout(function(){
    var el=d.querySelector('.fml');
    if(el) el.scrollIntoView();
  },300);
},900)});
</script></body></html>
